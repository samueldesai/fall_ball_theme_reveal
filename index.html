<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stanford Fall Ball 2026 | Theme Reveal</title>
  <meta name="description" content="The official theme reveal for the Stanford Fall Ball 2026.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #04030f;
      --nebula-violet: #6d3bd6;
      --nebula-pink: #d94fd6;
      --cyan: #5ee7ff;
      --star: #f2f4ff;
      --muted: #a9b0d8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: "Exo 2", system-ui, sans-serif;
      color: var(--star);
      background:
        radial-gradient(ellipse at 20% 15%, rgba(109, 59, 214, 0.35), transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(217, 79, 214, 0.22), transparent 45%),
        radial-gradient(ellipse at 60% 40%, rgba(94, 231, 255, 0.08), transparent 40%),
        var(--void);
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* a slowly drifting planet on the horizon */
    .planet {
      position: fixed;
      right: -14vmin;
      bottom: -22vmin;
      width: 58vmin;
      height: 58vmin;
      border-radius: 50%;
      z-index: 0;
      background: radial-gradient(circle at 32% 30%, #b9a4ff, #6d3bd6 38%, #2a1170 70%, #0d0630 100%);
      box-shadow: 0 0 80px 10px rgba(109, 59, 214, 0.35), inset -30px -20px 60px rgba(0, 0, 0, 0.6);
      animation: drift 30s ease-in-out infinite alternate;
    }

    .planet::after {
      content: "";
      position: absolute;
      left: -22%;
      top: 44%;
      width: 144%;
      height: 14%;
      border-radius: 50%;
      border: 2px solid rgba(94, 231, 255, 0.45);
      transform: rotate(-16deg);
    }

    @keyframes drift {
      from { transform: translate(0, 0) rotate(0deg); }
      to { transform: translate(-3vmin, -2vmin) rotate(8deg); }
    }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      text-align: center;
    }

    .screen[hidden] {
      display: none;
    }

    .kicker {
      margin-bottom: 18px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      font-weight: 500;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    h1 {
      margin-bottom: 14px;
      font-family: "Orbitron", sans-serif;
      font-weight: 900;
      font-size: clamp(2.2rem, 8vw, 5rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--cyan), #c9b8ff 45%, var(--nebula-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 24px rgba(109, 59, 214, 0.55));
    }

    .tagline {
      margin-bottom: 34px;
      font-weight: 300;
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .reveal-btn {
      padding: 16px 32px;
      border: 1px solid rgba(94, 231, 255, 0.6);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--nebula-violet), var(--nebula-pink));
      color: #fff;
      font-family: "Orbitron", sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease;
      animation: glow 2.4s ease-in-out infinite;
    }

    .reveal-btn:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .reveal-btn:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(217, 79, 214, 0.35), 0 0 0 rgba(94, 231, 255, 0); }
      50% { box-shadow: 0 0 40px rgba(217, 79, 214, 0.6), 0 0 18px rgba(94, 231, 255, 0.45); }
    }

    .hint {
      margin-top: 18px;
      font-size: 0.75rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .intro-line {
      font-family: "Orbitron", sans-serif;
      font-weight: 500;
      font-size: clamp(0.95rem, 3vw, 1.5rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--star);
    }

    .count {
      display: block;
      margin-top: 14px;
      font-family: "Orbitron", sans-serif;
      font-weight: 900;
      font-size: clamp(7rem, 30vw, 16rem);
      line-height: 1;
      color: var(--cyan);
      text-shadow: 0 0 40px rgba(94, 231, 255, 0.7), 0 0 90px rgba(109, 59, 214, 0.8);
    }

    .count.tick {
      animation: tick 1s ease-out;
    }

    @keyframes tick {
      0% { transform: scale(0.4); opacity: 0; filter: blur(10px); }
      25% { transform: scale(1); opacity: 1; filter: none; }
      80% { opacity: 1; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    #player {
      z-index: 2;
      background: #000;
      padding: 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    @media (prefers-reduced-motion: reduce) {
      .planet,
      .reveal-btn,
      .count.tick {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="planet" aria-hidden="true"></div>

  <section class="screen" id="start">
    <div>
      <p class="kicker">Stanford Fall Ball &middot; 2026</p>
      <h1>The Theme Reveal</h1>
      <p class="tagline">This year's ball is out of this world.</p>
      <button class="reveal-btn" id="revealBtn" type="button">Reveal the Theme</button>
      <p class="hint">Sound on for the full experience</p>
    </div>
  </section>

  <section class="screen" id="countdown" hidden>
    <div>
      <p class="intro-line">Introducing the Fall Ball theme in&hellip;</p>
      <span class="count" id="count" aria-live="assertive">3</span>
    </div>
  </section>

  <section class="screen" id="player" hidden>
    <video id="video" src="fall-ball-theme.mp4" preload="auto" playsinline controls></video>
  </section>

  <script>
    /* ---------- starfield ---------- */
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let stars = [];
    let shooting = null;
    let warp = 1;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round((innerWidth * innerHeight) / 2600);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.3 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.005,
        drift: Math.random() * 0.15 + 0.02,
        hue: Math.random() < 0.15 ? (Math.random() < 0.5 ? 190 : 290) : 230
      }));
    }

    function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;
      for (const s of stars) {
        s.phase += s.speed;
        if (warp > 1) {
          // rush outward from the center during the countdown
          s.x += (s.x - cx) * 0.004 * warp;
          s.y += (s.y - cy) * 0.004 * warp;
          if (s.x < 0 || s.x > innerWidth || s.y < 0 || s.y > innerHeight) {
            s.x = cx + (Math.random() - 0.5) * 80;
            s.y = cy + (Math.random() - 0.5) * 80;
          }
        } else {
          s.x -= s.drift;
          if (s.x < 0) s.x = innerWidth;
        }
        const alpha = 0.45 + 0.55 * Math.abs(Math.sin(s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * (warp > 1 ? 1.4 : 1), 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue}, 90%, 90%, ${alpha})`;
        ctx.fill();
      }

      if (!shooting && Math.random() < 0.006) {
        shooting = { x: Math.random() * innerWidth * 0.8 + innerWidth * 0.2, y: Math.random() * innerHeight * 0.4, life: 1 };
      }
      if (shooting) {
        const len = 140;
        const grad = ctx.createLinearGradient(shooting.x, shooting.y, shooting.x + len, shooting.y - len * 0.45);
        grad.addColorStop(0, `rgba(255, 255, 255, ${shooting.life})`);
        grad.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(shooting.x, shooting.y);
        ctx.lineTo(shooting.x + len, shooting.y - len * 0.45);
        ctx.stroke();
        shooting.x -= 9;
        shooting.y += 4;
        shooting.life -= 0.02;
        if (shooting.life <= 0) shooting = null;
      }

      if (!reduced) requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener("resize", () => {
      resize();
      if (reduced) frame();
    });
    frame();

    /* ---------- reveal ---------- */
    const start = document.getElementById("start");
    const countdown = document.getElementById("countdown");
    const player = document.getElementById("player");
    const count = document.getElementById("count");
    const video = document.getElementById("video");

    document.getElementById("revealBtn").addEventListener("click", () => {
      // Start and immediately pause inside the click, so the browser lets the
      // video play with sound after the countdown (needed on Safari/iOS).
      video.play().then(() => {
        video.pause();
        video.currentTime = 0;
      }).catch(() => {});

      start.hidden = true;
      countdown.hidden = false;
      warp = 3;

      let n = 3;
      const show = () => {
        count.textContent = n;
        count.classList.remove("tick");
        void count.offsetWidth;
        count.classList.add("tick");
        warp = 3 + (3 - n) * 2;
      };
      show();

      const timer = setInterval(() => {
        n -= 1;
        if (n > 0) {
          show();
          return;
        }
        clearInterval(timer);
        warp = 1;
        countdown.hidden = true;
        player.hidden = false;
        video.currentTime = 0;
        video.play().catch(() => {
          /* if playback is still blocked, the controls let them press play */
        });
      }, 1000);
    });
  </script>
</body>
</html>
